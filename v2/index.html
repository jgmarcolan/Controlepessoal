function restorePanelBackup(e){const f=e.target.files&&e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=async()=>{try{const p=JSON.parse(reader.result);if(!Array.isArray(p.transactions))throw new Error('Arquivo não reconhecido como backup do painel.');if(!confirm('Restaurar e combinar os dados deste arquivo com os dados atuais?'))return;data=mergeRecords(data,p.transactions);localStorage.setItem(KEY,JSON.stringify(data));if(p.workouts)localStorage.setItem(WORKKEY,JSON.stringify(mergeRecords(JSON.parse(localStorage.getItem(WORKKEY)||'[]'),p.workouts)));if(p.shopping)localStorage.setItem(SHOPKEY,JSON.stringify(mergeRecords(JSON.parse(localStorage.getItem(SHOPKEY)||'[]'),p.shopping)));if(p.tasks)localStorage.setItem('meuPainelTarefas_v2',JSON.stringify(mergeRecords(JSON.parse(localStorage.getItem('meuPainelTarefas_v2')||'[]'),p.tasks)));await syncData(false);message='Backup restaurado e combinado com os dados atuais.';render();const m=document.getElementById('accountmodal');if(m)m.remove()}catch(err){alert('Não foi possível restaurar o backup: '+err.message)}};reader.readAsText(f)}

async function auth(signup){if(!cloud){document.getElementById('authmsg').textContent='Serviço de conta indisponível no momento.';return}const email=document.getElementById('authmail').value.trim(),password=document.getElementById('authpass').value;const r=signup?await cloud.auth.signUp({email,password}):await cloud.auth.signInWithPassword({email,password});if(r.error){document.getElementById('authmsg').textContent=r.error.message;return}if(signup&&!r.data.session){document.getElementById('authmsg').textContent='Cadastro criado. Confere teu e-mail para confirmar a conta e depois entra.';return}currentUser=r.data.user;cloudStatus='Conta conectada';await syncData(false);render();const m=document.getElementById('accountmodal');if(m)m.remove()}

 };
 const relevant=data.filter(matches);

function svgBarChart(items, incomeKey, expenseKey, labelKey, titleIncome, titleExpense){
 const W=720,H=230,L=36,R=12,T=16,B=35,plotH=H-T-B,plotW=W-L-R;
 const max=Math.max(1,...items.flatMap(m=>[Number(m[incomeKey]||0),Number(m[expenseKey]||0)]));
 const groupW=plotW/Math.max(1,items.length),barW=Math.min(24,groupW*.27);
 let svg='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gráfico de '+esc(titleIncome)+' e '+esc(titleExpense)+'" style="display:block;width:100%;height:auto;min-height:190px;overflow:visible">';
 [0,.25,.5,.75,1].forEach(p=>{const y=T+plotH*(1-p);svg+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="#dce5ef" stroke-width="1"/>';});
 items.forEach((m,i)=>{const cx=L+groupW*(i+.5),a=Number(m[incomeKey]||0),b=Number(m[expenseKey]||0),ha=a/max*plotH,hb=b/max*plotH;svg+='<rect x="'+(cx-barW-2)+'" y="'+(T+plotH-ha)+'" width="'+barW+'" height="'+Math.max(0,ha)+'" rx="3" fill="#159b77"><title>'+esc(titleIncome)+': '+money(a)+'</title></rect><rect x="'+(cx+2)+'" y="'+(T+plotH-hb)+'" width="'+barW+'" height="'+Math.max(0,hb)+'" rx="3" fill="#dc6471"><title>'+esc(titleExpense)+': '+money(b)+'</title></rect><text x="'+cx+'" y="'+(H-10)+'" fill="#61738a" font-size="12" text-anchor="middle">'+esc(m[labelKey])+'</text>';});
 svg+='</svg><div style="display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:#61738a;margin-top:8px"><span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:#159b77;margin-right:6px"></i>'+esc(titleIncome)+'</span><span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:#dc6471;margin-right:6px"></i>'+esc(titleExpense)+'</span></div>';return svg;
}
function chart(){const ms=[];const d=new Date(filterMonth+'-02T12:00:00');for(let i=5;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);const key=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');let m={key,label:x.toLocaleDateString('pt-BR',{month:'short'}),income:0,expense:0};data.filter(t=>(t.competence||t.date||'').slice(0,7)===key&&t.dre!==false).forEach(t=>{if(t.type==='income')m.income+=Number(t.amount||0);if(t.type==='expense')m.expense+=Number(t.amount||0)});ms.push(m)}return svgBarChart(ms,'income','expense','label','Receitas','Despesas')}
