<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f"><title>Meu Painel Pessoal</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#0c1929;--line:#22354e;--muted:#8fa4c0;--blue:#347df4;--green:#42d6a0;--red:#ff818d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#112c50 0,transparent 35%),var(--bg);color:#eaf1fc;font:14px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1180px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.logo{display:grid;place-items:center;background:linear-gradient(135deg,#347df4,#17478f);border-radius:13px;width:44px;height:44px;font-size:22px}.eyebrow{font-size:10px;letter-spacing:1.5px;color:#78aaff;font-weight:800}.muted{color:var(--muted)}h1{font-size:28px;margin:2px 0}h2{font-size:22px;margin:0 0 7px}.btn{border:1px solid #3e86fa;background:var(--blue);color:white;padding:11px 14px;border-radius:10px;font-weight:700}.btn.secondary{background:#12243a;border-color:#304763}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:19px;margin-bottom:16px}.hero{background:linear-gradient(115deg,#102a4d,#0c1b30);border-color:#294c78;padding:26px}.hero h2{font-size:30px}.hero span{color:#76aaff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:15px 0}.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}.stat small{color:var(--muted);display:block}.stat strong{font-size:clamp(18px,2.4vw,25px);display:block;margin-top:9px;overflow-wrap:anywhere}.layout{display:grid;grid-template-columns:1.2fr 1fr;gap:15px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px;color:#a9bbd2;font-size:12px}.field input,.field select,.field textarea{width:100%;padding:11px;border-radius:8px;border:1px solid #2c415d;background:#091726;color:#eff5ff;min-width:0}.full{grid-column:1/-1}.notice{padding:12px;border-radius:9px;background:#122b49;border:1px solid #2b527f;margin:12px 0;color:#c8dcff}.error{background:#3b202b;border-color:#743744;color:#ffd2d7}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap;font-size:12px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #1e3047}th{font-size:10px;color:#8297b4}td small{display:block;color:#8297b4;margin-top:3px}.right{text-align:right}.income{color:var(--green)}.expense{color:var(--red)}.empty{text-align:center;padding:28px;color:var(--muted)}.hidden{display:none!important}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}.tabs button{background:#101f32;border:1px solid #263b55;color:#aebfd6;border-radius:9px;padding:9px 12px}.tabs button.active{background:#19365b;color:#fff;border-color:#477dc3}.small{font-size:11px}.footer{color:#657d9d;font-size:11px;padding:10px 2px}.auth{max-width:430px;margin:8vh auto}.auth .card{padding:26px}.config{font-size:12px;line-height:1.7;color:#adc0d9}.config code{color:#9bc3ff;background:#13243a;padding:2px 5px;border-radius:4px}@media(max-width:760px){.wrap{padding:14px}.head{align-items:flex-start}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:1fr}.hero h2{font-size:25px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.hide-mobile{display:none}}
</style>
</head>
<body><div id="app" class="wrap"><div class="auth"><div class="card"><div class="brand"><div class="logo">◆</div><div><div class="eyebrow">TEU ESPAÇO, TEUS NÚMEROS</div><h1>Meu Painel<span style="color:#76aaff">.</span></h1></div></div><p class="muted">Carregando painel...</p></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* CONFIGURE COM A URL DO PROJETO E A CHAVE PUBLISHABLE/ANON DO SUPABASE.
   Nunca coloque a chave service_role neste arquivo. */
const SUPABASE_URL = "https://eawkhorcsukizjslvwae.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_VxaI1hwKxWOyS4oqgDTDqA_7__f5y2C";
const root=document.getElementById('app');
const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const isoToday=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const month=()=>isoToday().slice(0,7);
let db=null,session=null,transactions=[],showForm=false,tab='overview',message='';
function notice(text,error=false){message=text;let el=document.getElementById('notice');if(el){el.textContent=text;el.className='notice'+(error?' error':'');el.classList.remove('hidden')}}
function setup(){root.innerHTML=`<div class="auth"><div class="card"><div class="brand"><div class="logo">◆</div><div><div class="eyebrow">CONFIGURAÇÃO INICIAL</div><h1>Conecta teu painel.</h1></div></div><p class="muted">Só falta informar a URL do Supabase e a chave publicável.</p><div class="config">1. No Supabase, abre <b>Project Settings → API</b>.<br>2. Copia a <b>Project URL</b> e a chave <b>publishable</b> (ou anon legada).<br>3. Neste arquivo, substitui <code>https://eawkhorcsukizjslvwae.supabase.co</code> e <code>sb_publishable_VxaI1hwKxWOyS4oqgDTDqA_7__f5y2C</code> no começo do script.<br><br>Não uses a chave <code>service_role</code>.</div></div></div>`}
function login(){root.innerHTML=`<div class="auth"><div class="card"><div class="brand"><div class="logo">◆</div><div><div class="eyebrow">TEU ESPAÇO, TEUS NÚMEROS</div><h1>Meu Painel<span style="color:#76aaff">.</span></h1></div></div><p class="muted">Finanças, investimentos e treinos num só lugar.</p><form id="authform"><label class="field">E-mail<input id="email" type="email" required autocomplete="email"></label><br><label class="field">Senha<input id="password" type="password" required minlength="6" autocomplete="current-password"></label><br><button class="btn" style="width:100%">Entrar</button><br><br><button class="btn secondary" id="signup" type="button" style="width:100%">Criar minha conta</button></form><div id="notice" class="notice hidden"></div><p class="small muted">Os registros são separados por usuário pelas políticas de segurança do banco.</p></div></div>`;
document.getElementById('authform').onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});if(error)notice(error.message,true)};
document.getElementById('signup').onclick=async()=>{const {data,error}=await db.auth.signUp({email:document.getElementById('email').value,password:document.getElementById('password').value});if(error)notice(error.message,true);else notice('Conta criada. Se a confirmação por e-mail estiver ativa, confirma no teu e-mail.')};
}
async function load(){const {data,error}=await db.from('transactions').select('id,description,amount,type,category_name,transaction_date,competence_date,cash_date,payment_method,recurrence_class,notes,is_dre_included').order('transaction_date',{ascending:false}).limit(300);if(error){notice('Erro ao carregar: '+error.message,true);return}transactions=data||[];render()}
function render(){const m=month();const rows=transactions.filter(t=>(t.competence_date||t.transaction_date||'').slice(0,7)===m);const inc=rows.filter(t=>t.type==='income'&&t.is_dre_included!==false).reduce((s,t)=>s+Number(t.amount),0);const exp=rows.filter(t=>t.type==='expense'&&t.is_dre_included!==false).reduce((s,t)=>s+Number(t.amount),0);
root.innerHTML=`<header class="head"><div class="brand"><div class="logo">◆</div><div><div class="eyebrow">ORGANIZAÇÃO PESSOAL</div><h1>Meu Painel<span style="color:#76aaff">.</span></h1></div></div><button class="btn" id="new">＋ Novo lançamento</button></header>
<div class="tabs"><button class="${tab==='overview'?'active':''}" data-tab="overview">Visão geral</button><button class="${tab==='finance'?'active':''}" data-tab="finance">Financeiro</button><button data-tab="investments" class="${tab==='investments'?'active':''}">Investimentos</button><button data-tab="workouts" class="${tab==='workouts'?'active':''}">Treinos</button><button id="refresh" class="hide-mobile">Atualizar</button><button id="logout" class="hide-mobile">Sair</button></div>
${tab==='overview'?`<section class="card hero"><div class="eyebrow">TEU RESUMO FINANCEIRO</div><h2>Organiza hoje.<br><span>Decide melhor amanhã.</span></h2><p class="muted">Resumo baseado nos lançamentos registrados.</p></section><div class="stats"><div class="stat"><small>Receitas do mês</small><strong class="income">${money(inc)}</strong></div><div class="stat"><small>Despesas do mês</small><strong class="expense">${money(exp)}</strong></div><div class="stat"><small>Resultado do mês</small><strong>${money(inc-exp)}</strong></div><div class="stat"><small>Lançamentos no mês</small><strong>${rows.length}</strong></div></div><div class="layout"><section class="card"><h2>Últimos lançamentos</h2>${table(transactions.slice(0,8))}</section><section class="card"><h2>Despesas por categoria</h2>${categories(rows)}</section></div>`:
tab==='finance'?`<section class="card"><div class="row"><div><h2>Lançamentos financeiros</h2><p class="muted small">Competência da DRE e data real do caixa separadas.</p></div></div><div id="formslot"></div>${table(transactions)}</section>`:
`<section class="card"><h2>${tab==='investments'?'Investimentos':'Treinos'}</h2><p class="muted">A estrutura de dados já está preparada no Supabase. Esta área será desenvolvida na próxima etapa.</p><div class="notice">Em construção — nenhum dado fictício foi criado.</div></section>`}
<div id="notice" class="notice ${message?'':'hidden'}">${message}</div><div class="footer">Meu Painel Pessoal • Dados por usuário • versão inicial</div>`;
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.getElementById('new').onclick=()=>{tab='finance';showForm=!showForm;render()};document.getElementById('refresh').onclick=load;document.getElementById('logout').onclick=async()=>db.auth.signOut();
if(tab==='finance'&&showForm)form();
}
function table(rows){if(!rows.length)return '<div class="empty">Nenhum lançamento por enquanto. Adiciona o primeiro para começar.</div>';return `<div class="tablewrap"><table><thead><tr><th>Descrição</th><th>Categoria</th><th>Data</th><th>Tipo</th><th class="right">Valor</th></tr></thead><tbody>${rows.map(t=>`<tr><td>${esc(t.description)}<small>${esc(t.payment_method||'—')}</small></td><td>${esc(t.category_name||'Sem categoria')}</td><td>${t.transaction_date?new Date(t.transaction_date+'T12:00:00').toLocaleDateString('pt-BR'):'—'}</td><td>${t.type==='income'?'Receita':t.type==='expense'?'Despesa':t.type==='investment'?'Investimento':'Movimentação'}</td><td class="right ${t.type==='income'?'income':t.type==='expense'?'expense':''}">${t.type==='income'?'+ ':t.type==='expense'?'- ':''}${money(t.amount)}</td></tr>`).join('')}</tbody></table></div>`}
function categories(rows){let a={};rows.filter(t=>t.type==='expense').forEach(t=>{let c=t.category_name||'Sem categoria';a[c]=(a[c]||0)+Number(t.amount)});let list=Object.entries(a).sort((a,b)=>b[1]-a[1]);if(!list.length)return '<div class="empty">Ainda não há despesas neste mês.</div>';let max=list[0][1]||1;return list.map(([n,v])=>`<p>${esc(n)} <b style="float:right">${money(v)}</b></p><div style="height:5px;background:#20334b;border-radius:5px;margin-bottom:16px"><div style="height:5px;width:${Math.max(3,v/max*100)}%;background:#347df4;border-radius:5px"></div></div>`).join('')}
function form(){const slot=document.getElementById('formslot');slot.innerHTML=`<form id="txform" class="card" style="background:#091726"><div class="formgrid"><label class="field">Descrição<input id="desc" required placeholder="Ex.: mercado, salário"></label><label class="field">Valor (R$)<input id="amount" required inputmode="decimal" placeholder="87,58"></label><label class="field">Tipo<select id="type"><option value="expense">Despesa</option><option value="income">Receita</option><option value="investment">Investimento</option><option value="own_transfer">Transferência entre contas</option><option value="credit_card_payment">Pagamento de fatura</option><option value="reimbursement_received">Reembolso recebido</option></select></label><label class="field">Categoria<input id="category" placeholder="Mercado, Transporte..."></label><label class="field">Data da movimentação<input id="date" type="date" required value="${isoToday()}"></label><label class="field">Competência DRE<input id="competence" type="date" value="${isoToday()}"></label><label class="field">Data do caixa<input id="cash" type="date" value="${isoToday()}"></label><label class="field">Pagamento<input id="payment" placeholder="Crédito, Pix, Flash..."></label><label class="field">Classificação<select id="recurrence"><option value="variable">Variável</option><option value="fixed">Fixa</option><option value="extraordinary">Extraordinária</option><option value="recurring">Recorrente</option><option value="unclassified">Não classificada</option></select></label><label class="field full">Observações<textarea id="notes" rows="2"></textarea></label></div><br><div class="row"><button type="button" id="cancel" class="btn secondary">Cancelar</button><button class="btn">Salvar lançamento</button></div></form>`;
document.getElementById('cancel').onclick=()=>{showForm=false;render()};document.getElementById('txform').onsubmit=async e=>{e.preventDefault();let type=document.getElementById('type').value;let amount=Number(document.getElementById('amount').value.replace(',','.'));if(!amount||amount<0){notice('Confere o valor informado.',true);return}let row={user_id:session.user.id,description:document.getElementById('desc').value.trim(),amount,type,category_name:document.getElementById('category').value.trim()||(type==='income'?'Outras receitas':'Outros gastos'),transaction_date:document.getElementById('date').value,competence_date:document.getElementById('competence').value||null,cash_date:document.getElementById('cash').value||null,payment_method:document.getElementById('payment').value.trim()||null,recurrence_class:document.getElementById('recurrence').value,notes:document.getElementById('notes').value.trim()||null,source:'manual',status:'confirmed',is_dre_included:['income','expense'].includes(type),is_cash_included:true};const {error}=await db.from('transactions').insert(row);if(error){notice('Não consegui salvar: '+error.message,true);return}showForm=false;message='Lançamento salvo na nuvem!';await load()};
}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
(async()=>{if(SUPABASE_URL.startsWith('COLE_AQUI')||SUPABASE_ANON_KEY.startsWith('COLE_AQUI')){setup();return}try{db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const {data}=await db.auth.getSession();session=data.session;db.auth.onAuthStateChange((_e,s)=>{session=s;if(session)load();else login()});if(session)await load();else login()}catch(e){root.innerHTML='<div class="card">Não consegui iniciar a conexão. Confere a URL e a chave publicável do Supabase.</div>'}})();
</script></body></html>
