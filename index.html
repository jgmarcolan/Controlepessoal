function routine(){const KEYT='meuPainelTarefas_v1';let tasks=JSON.parse(localStorage.getItem(KEYT)||'[]');return '<section class="card"><h2>Rotina pessoal</h2><p class="muted">Tarefas rápidas, sem complicar teu dia.</p><form id="taskform" class="row"><input id="taskname" required placeholder="Ex.: separar roupa do treino" style="min-width:0;flex:1;padding:12px;border-radius:8px;border:1px solid #2c415d;background:#091726;color:#eff5ff"><button class="btn">＋ Adicionar</button></form><div style="margin-top:12px">'+(tasks.length?tasks.map(t=>'<div class="row" style="padding:10px 0;border-bottom:1px solid #22354e"><label style="display:flex;align-items:center;gap:10px;flex:1"><input type="checkbox" data-task="'+esc(t.id)+'" '+(t.done?'checked':'')+'><span style="'+(t.done?'text-decoration:line-through;color:#8297b4':'')+'">'+esc(t.name)+'</span></label><button class="btn secondary" data-taskdel="'+esc(t.id)+'">×</button></div>').join(''):'<div class="empty">Sem tarefas cadastradas.</div>')+'</div></section><section class="card"><h2>Conta e dados</h2><p class="muted">Usa Conta / backup no rodapé para sincronizar entre dispositivos ou exportar uma cópia.</p></section>';document.getElementById('taskform').onsubmit=e=>{e.preventDefault();tasks.push({id:'task-'+Date.now(),name:document.getElementById('taskname').value.trim(),done:false});localStorage.setItem(KEYT,JSON.stringify(tasks));render()};document.querySelectorAll('[data-task]').forEach(b=>b.onchange=()=>{const t=tasks.find(t=>t.id===b.dataset.task);if(t)t.done=b.checked;localStorage.setItem(KEYT,JSON.stringify(tasks));render()});document.querySelectorAll('[data-taskdel]').forEach(b=>b.onclick=()=>{localStorage.setItem(KEYT,JSON.stringify(tasks.filter(t=>t.id!==b.dataset.taskdel)));render()})}

function workouts(){return '<section class="card"><h2>Registrar atividade</h2><p class="muted">Salva academia, corrida, esteira ou caminhada neste celular.</p><form id="workform" class="formgrid"><label class="field">Modalidade<select id="wtype"><option>Academia</option><option>Corrida</option><option>Esteira</option><option>Caminhada</option><option>Outro</option></select></label><label class="field">Data<input id="wdate" type="date" value="'+now()+'" required></label><label class="field">Divisão do treino<select id="wsession"><option>Costas e bíceps</option><option>Peito e tríceps</option><option>Pernas</option><option>Pernas e ombros</option><option>Corrida</option><option>Outro</option></select></label><label class="field full">Exercício / descrição<input id="wname" required placeholder="Ex.: puxada alta, corrida na Orla..."></label><label class="field">Peso (kg)<input id="wweight" type="number" min="0" step="0.5"></label><label class="field">Séries<input id="wsets" type="number" min="0"></label><label class="field">Repetições<input id="wreps" type="number" min="0"></label><label class="field">Distância (km)<input id="wdistance" type="number" min="0" step="0.01"></label><label class="field">Duração (minutos)<input id="wduration" type="number" min="0"></label><label class="field full">Observações<input id="wnote" placeholder="Como foi o treino, esforço..."></label><div class="full"><button class="btn">Salvar atividade</button></div></form></section><section class="card"><h2>Corrida com GPS</h2><p class="muted">Grava o trajeto enquanto esta tela fica aberta. Precisa autorizar a localização. Distância estimada conforme o sinal.</p><div class="stats"><div class="stat"><small>Distância</small><strong id="gpsdist">0,00 km</strong></div><div class="stat"><small>Tempo</small><strong id="gpstime">00:00</strong></div><div class="stat"><small>Ritmo médio</small><strong id="gpspace">—</strong></div></div><div class="row"><button class="btn" id="gpsstart">▶ Iniciar GPS</button><button class="btn secondary" id="gpsstop" disabled>■ Finalizar e salvar</button></div><p id="gpsmsg" class="muted">O GPS só começa quando tu tocar em iniciar.</p></section><section class="card"><h2>Histórico de atividades</h2>'+(workoutsData.length?workoutsData.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")).map(w=>'<div class="row" style="padding:10px 0;border-bottom:1px solid #22354e"><div><b>'+esc(w.name)+'</b><small>'+esc(w.type)+' · '+esc(w.date)+(w.weight?' · '+esc(w.weight)+' kg':'')+(w.sets?' · '+esc(w.sets)+' séries':'')+(w.reps?' × '+esc(w.reps)+' reps':'')+(w.distance?' · '+esc(w.distance)+' km':'')+(w.duration?' · '+esc(w.duration)+' min':'')+(w.note?' · '+esc(w.note):'')+'</small></div><button class="btn secondary" data-delwork="'+esc(w.id)+'">Excluir</button></div>').join(""):'<div class="empty">Nenhuma atividade nova salva. Último treino conhecido: costas e bíceps em 03/10/2026 — puxada alta 45 kg, remada baixa 45 kg, pullover 25 kg, Scott 30 kg e martelo 8 kg.</div>')+'</section>';document.getElementById("workform").onsubmit=e=>{e.preventDefault();const w={id:"w-"+Date.now(),type:document.getElementById("wtype").value,session:document.getElementById("wsession").value,date:document.getElementById("wdate").value,name:document.getElementById("wname").value.trim(),weight:document.getElementById("wweight").value,sets:document.getElementById("wsets").value,reps:document.getElementById("wreps").value,distance:document.getElementById("wdistance").value,duration:document.getElementById("wduration").value,note:document.getElementById("wnote").value.trim()};workoutsData.push(w);localStorage.setItem(WORKKEY,JSON.stringify(workoutsData));syncData(false);message="Atividade salva!";render()};document.querySelectorAll("[data-delwork]").forEach(b=>b.onclick=()=>{workoutsData=workoutsData.filter(w=>w.id!==b.dataset.delwork);localStorage.setItem(WORKKEY,JSON.stringify(workoutsData));syncData(false);render()});document.getElementById("gpsstart").onclick=startGPS;document.getElementById("gpsstop").onclick=stopGPS}
function shopping(){return '<section class="card"><h2>Lista do mercado</h2><p class="muted">Marca o que já comprou. Fica salva neste celular.</p><form id="shopform" class="row"><input id="shopitem" required placeholder="Adicionar item..." style="min-width:0;flex:1;padding:12px;border-radius:8px;border:1px solid #2c415d;background:#091726;color:#eff5ff"><button class="btn">＋ Adicionar</button></form><div class="row" style="margin:14px 0"><span class="muted">'+shoppingData.filter(x=>!x.done).length+' pendentes · '+shoppingData.filter(x=>x.done).length+' comprados</span><button class="btn secondary" id="shopclear">Limpar comprados</button></div>'+(shoppingData.length?shoppingData.map(x=>'<div class="row" style="padding:10px 0;border-bottom:1px solid #22354e"><label style="display:flex;align-items:center;gap:10px;flex:1"><input type="checkbox" data-shopcheck="'+esc(x.id)+'" '+(x.done?'checked':'')+'><span style="'+(x.done?'text-decoration:line-through;color:#8297b4':'')+'">'+esc(x.name)+'</span></label><button class="btn secondary" data-shopdel="'+esc(x.id)+'">×</button></div>').join(""):'<div class="empty">Lista vazia. Adiciona o que precisa comprar.</div>')+'</section><section class="card"><h2>Adicionar itens da tua lista habitual</h2><div class="row" style="flex-wrap:wrap;justify-content:flex-start">'+["Banana","Ovos (verificar validade)","Pão de alho","Coxa e sobrecoxa de frango","Peito de frango","Páprica defumada","Queijo","Presunto","Peito de peru","Requeijão","Cuca","Sabonete","Desodorante"].map(n=>'<button class="btn secondary" data-quickshop="'+esc(n)+'">＋ '+esc(n)+'</button>').join("")+'</div><p class="muted">Pão e leite não entram como pendentes porque tu já tinha dito que tinha em casa.</p></section>';document.getElementById("shopform").onsubmit=e=>{e.preventDefault();const n=document.getElementById("shopitem").value.trim();if(n&&!shoppingData.some(x=>x.name.toLowerCase()===n.toLowerCase()&&!x.done))shoppingData.push({id:"s-"+Date.now(),name:n,done:false});localStorage.setItem(SHOPKEY,JSON.stringify(shoppingData));render()};document.querySelectorAll("[data-shopcheck]").forEach(b=>b.onchange=()=>{const x=shoppingData.find(x=>x.id===b.dataset.shopcheck);if(x)x.done=b.checked;localStorage.setItem(SHOPKEY,JSON.stringify(shoppingData));render()});document.querySelectorAll("[data-shopdel]").forEach(b=>b.onclick=()=>{shoppingData=shoppingData.filter(x=>x.id!==b.dataset.shopdel);localStorage.setItem(SHOPKEY,JSON.stringify(shoppingData));render()});document.querySelectorAll("[data-quickshop]").forEach(b=>b.onclick=()=>{const n=b.dataset.quickshop;if(!shoppingData.some(x=>x.name.toLowerCase()===n.toLowerCase()&&!x.done))shoppingData.push({id:"s-"+Date.now(),name:n,done:false});localStorage.setItem(SHOPKEY,JSON.stringify(shoppingData));render()});document.getElementById("shopclear").onclick=()=>{shoppingData=shoppingData.filter(x=>!x.done);localStorage.setItem(SHOPKEY,JSON.stringify(shoppingData));render()}}
function startGPS(){if(!navigator.geolocation){document.getElementById("gpsmsg").textContent="Este navegador não oferece GPS.";return}if(!isSecureContext){document.getElementById("gpsmsg").textContent="GPS exige HTTPS. Abre o painel pelo endereço seguro.";return}gpsDistance=0;gpsPoints=[];gpsLast=null;gpsStart=Date.now();document.getElementById("gpsstart").disabled=true;document.getElementById("gpsstop").disabled=false;document.getElementById("gpsmsg").textContent="Buscando sinal GPS…";gpsTimer=setInterval(()=>{const sec=Math.floor((Date.now()-gpsStart)/1000),el=document.getElementById("gpstime");if(el)el.textContent=String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");const p=document.getElementById("gpspace");if(p)p.textContent=gpsDistance>0?(sec/60/gpsDistance).toFixed(1).replace(".",",")+" min/km":"—"},1000);gpsWatch=navigator.geolocation.watchPosition(pos=>{const p={lat:pos.coords.latitude,lon:pos.coords.longitude,ts:pos.timestamp,accuracy:pos.coords.accuracy};if(p.accuracy>60)return;if(gpsLast){const d=haversine(gpsLast.lat,gpsLast.lon,p.lat,p.lon);if(d>=0.008&&d<0.5)gpsDistance+=d;else if(d>=0.5)return}gpsLast=p;gpsPoints.push(p);const de=document.getElementById("gpsdist");if(de)de.textContent=gpsDistance.toFixed(2).replace(".",",")+" km";document.getElementById("gpsmsg").textContent="GPS ativo. Precisão aproximada: "+Math.round(p.accuracy)+" m."},err=>{document.getElementById("gpsmsg").textContent="Falha no GPS: "+err.message+". Confere a permissão de localização."},{enableHighAccuracy:true,maximumAge:2000,timeout:15000})}
function haversine(a,b,c,d){const R=6371,rad=x=>x*Math.PI/180,dl=rad(c-a),dn=rad(d-b);return 2*R*Math.asin(Math.sqrt(Math.sin(dl/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(dn/2)**2))}
function stopGPS(){if(gpsWatch!==null)navigator.geolocation.clearWatch(gpsWatch);if(gpsTimer)clearInterval(gpsTimer);const duration=Math.max(1,Math.round((Date.now()-gpsStart)/60000));if(gpsDistance>0||duration>1){workoutsData.push({id:"w-"+Date.now(),type:"Corrida GPS",date:now(),name:"Corrida registrada por GPS",distance:gpsDistance.toFixed(2),duration:String(duration),note:"Distância estimada; pontos de rota coletados: "+gpsPoints.length});localStorage.setItem(WORKKEY,JSON.stringify(workoutsData));message="Corrida GPS salva no histórico."}gpsWatch=null;gpsTimer=null;gpsStart=null;render()}
