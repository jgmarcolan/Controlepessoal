<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><meta name="description" content="Controle financeiro pessoal"><link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>Meu Painel Pessoal</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#0c1929;--line:#22354e;--muted:#8fa4c0;--blue:#347df4;--green:#42d6a0;--red:#ff818d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#112c50 0,transparent 35%),var(--bg);color:#eaf1fc;font:14px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:1180px;margin:auto;padding:18px}.head,.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.head{margin-bottom:20px}.brand{display:flex;align-items:center;gap:11px}.logo{display:grid;place-items:center;background:linear-gradient(135deg,#347df4,#17478f);border-radius:13px;width:44px;height:44px;font-size:22px}.eyebrow{font-size:10px;letter-spacing:1.5px;color:#78aaff;font-weight:800}h1{font-size:26px;margin:2px 0}h2{font-size:19px;margin:0 0 12px}.muted,small{color:var(--muted)}.btn{border:1px solid #3e86fa;background:var(--blue);color:white;padding:11px 14px;border-radius:10px;font-weight:700}.btn.secondary{background:#12243a;border-color:#304763}.card,.stat{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:17px;margin-bottom:14px}.hero{background:linear-gradient(115deg,#102a4d,#0c1b30);border-color:#294c78;padding:22px}.hero h2{font-size:26px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:13px 0}.stat small{display:block}.stat strong{font-size:clamp(18px,2.3vw,24px);display:block;margin-top:9px;overflow-wrap:anywhere}.layout{display:grid;grid-template-columns:1.1fr 1fr;gap:14px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px}.tabs button{background:#101f32;border:1px solid #263b55;color:#aebfd6;border-radius:9px;padding:9px 12px}.tabs button.active{background:#19365b;color:white;border-color:#477dc3}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{display:grid;gap:6px;color:#a9bbd2;font-size:12px}.field input,.field select{width:100%;padding:11px;border-radius:8px;border:1px solid #2c415d;background:#091726;color:#eff5ff}.full{grid-column:1/-1}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:left;padding:11px 7px;border-bottom:1px solid #1e3047}th{font-size:10px;color:#8297b4}td small{display:block;margin-top:3px}.right{text-align:right}.income{color:var(--green)}.expense{color:var(--red)}.empty{text-align:center;padding:24px;color:var(--muted)}.notice{padding:10px;border-radius:9px;background:#122b49;border:1px solid #2b527f;margin:10px 0}.footer{color:#657d9d;font-size:11px;padding:8px}.hidden{display:none!important}.barset{display:flex;align-items:end;gap:10px;height:170px}.monthbar{flex:1;min-width:0;text-align:center}.bars{height:135px;display:flex;align-items:end;justify-content:center;gap:3px}.bar{width:35%;border-radius:4px 4px 0 0;min-height:2px}.categoryrow{margin:13px 0}.track{height:5px;background:#20334b;border-radius:5px;margin-top:6px}.fill{height:5px;background:#347df4;border-radius:5px}@media(max-width:760px){.wrap{padding:12px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.hero h2{font-size:23px}.head{align-items:flex-start}.head .btn{padding:9px}.hide-mobile{display:none}}
</style></head><body><main id="app" class="wrap"><div class="card">Abrindo teu painel…</div></main>
<script>
const KEY='meuPainelDados_v1', now=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}, money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seed=[
{date:'2026-09-01',desc:'Passagem de ônibus',amount:53,type:'expense',cat:'Transporte — Porto Alegre',pay:'Pix',dre:true},
{date:'2026-09-01',desc:'Uber',amount:7.64,type:'expense',cat:'Transporte — Porto Alegre',pay:'Pix',dre:true},
{date:'2026-09-01',desc:'Gasto diverso',amount:18,type:'expense',cat:'Outros gastos',pay:'Pix',dre:true},
{date:'2026-09-01',desc:'Gasto diverso',amount:12,type:'expense',cat:'Outros gastos',pay:'Pix',dre:true},
{date:'2026-09-01',desc:'Gasto diverso',amount:5,type:'expense',cat:'Outros gastos',pay:'Pix',dre:true},
{date:'2026-09-01',desc:'Academia',amount:169.90,type:'expense',cat:'Saúde e academia',pay:'Cartão de crédito',dre:true},
{date:'2026-09-01',desc:'Game Pass',amount:76.90,type:'expense',cat:'Lazer e assinaturas',pay:'Cartão de crédito',dre:true},
{date:'2026-09-01',desc:'Café Dona Mina',amount:23,type:'expense',cat:'Alimentação',pay:'Cartão de crédito',dre:true},
{date:'2026-09-01',desc:'Presente para pai — Renner',amount:129.90,type:'expense',cat:'Presentes',pay:'Cartão de crédito',dre:true},
{date:'2026-09-01',desc:'Cuia de presente para chefe',amount:75,type:'expense',cat:'Presentes',pay:'Não informado',dre:true},
{date:'2026-09-01',desc:'Fatura cartão — setembro',amount:1157.46,type:'movement',cat:'Pagamento de cartão (não é nova despesa)',pay:'Conta bancária',dre:false,cash:true,note:'Fatura a pagar em outubro; não duplicar compras já lançadas.'},
{date:'2026-10-01',desc:'Salário',amount:3200,type:'income',cat:'Salário',pay:'Conta bancária',dre:true},
{date:'2026-10-01',desc:'Reembolso mensal de notebook',amount:100,type:'income',cat:'Reembolso',pay:'Conta bancária',dre:true,note:'Reembolso recorrente informado.'},
{date:'2026-10-01',desc:'MEI',amount:86.05,type:'expense',cat:'Impostos e taxas',pay:'Não informado',dre:true},
{date:'2026-10-06',desc:'Pix dos pais para aluguel — pai',amount:1250,type:'income',cat:'Ajuda familiar para aluguel',pay:'Pix',dre:true,note:'Receita não salarial destinada ao aluguel.'},
{date:'2026-10-06',desc:'Pix dos pais para aluguel — mãe',amount:1500,type:'income',cat:'Ajuda familiar para aluguel',pay:'Pix',dre:true,note:'Receita não salarial destinada ao aluguel.'},
{date:'2026-10-16',desc:'Mercado',amount:87.58,type:'expense',cat:'Mercado',pay:'Cartão de crédito',dre:true},
{date:'2026-10-17',desc:'Café com a galera',amount:38.40,type:'expense',cat:'Alimentação',pay:'Cartão de crédito',dre:true},
{date:'2026-10-17',desc:'Uber',amount:13.94,type:'expense',cat:'Transporte — Porto Alegre',pay:'Cartão de crédito',dre:true}
];
let data,tab='overview',showForm=false,filterMonth=now().slice(0,7),message='';try{data=JSON.parse(localStorage.getItem(KEY)||'null')}catch{}if(!Array.isArray(data))data=seed.map((x,i)=>({...x,id:'seed-'+i,competence:x.date,cash:x.cash?x.date:x.date,recurrence:'variable'}));
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function render(){const rows=data.filter(x=>(x.competence||x.date||'').slice(0,7)===filterMonth),inc=rows.filter(x=>x.type==='income'&&x.dre!==false).reduce((s,x)=>s+x.amount,0),exp=rows.filter(x=>x.type==='expense'&&x.dre!==false).reduce((s,x)=>s+x.amount,0);document.getElementById('app').innerHTML=`
<header class="head"><div class="brand"><div class="logo">◆</div><div><div class="eyebrow">ORGANIZAÇÃO PESSOAL</div><h1>Meu Painel<span style="color:#76aaff">.</span></h1></div></div><button class="btn" id="new">＋ Lançamento</button></header>
<div class="tabs"><button data-tab="overview" class="${tab==='overview'?'active':''}">Visão geral</button><button data-tab="finance" class="${tab==='finance'?'active':''}">Lançamentos</button><button data-tab="investments" class="${tab==='investments'?'active':''}">Investimentos</button><button data-tab="workouts" class="${tab==='workouts'?'active':''}">Treinos</button></div>
<div class="row" style="margin-bottom:12px"><span class="muted">Período da análise</span><select id="period" style="background:#091726;color:#fff;border:1px solid #2c415d;padding:8px;border-radius:8px">${['2026-08','2026-09','2026-10','2026-11','2026-12'].map(m=>'<option '+(m===filterMonth?'selected':'')+' value="'+m+'">'+new Date(m+'-02T12:00:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'})+'</option>').join('')}</select></div>
${tab==='overview'?`<section class="card hero"><div class="eyebrow">TEU RESUMO FINANCEIRO</div><h2>Organiza hoje.<br><span style="color:#76aaff">Decide melhor amanhã.</span></h2><p class="muted">Dados salvos neste dispositivo. Sem login e sem espera pelo banco.</p></section><div class="stats"><div class="stat"><small>Receitas do mês</small><strong class="income">${money(inc)}</strong></div><div class="stat"><small>Despesas do mês</small><strong class="expense">${money(exp)}</strong></div><div class="stat"><small>Resultado DRE</small><strong>${money(inc-exp)}</strong></div><div class="stat"><small>Lançamentos</small><strong>${rows.length}</strong></div></div><div class="layout"><section class="card"><h2>Evolução mensal</h2>${chart()}</section><section class="card"><h2>Despesas por categoria</h2>${cats(rows)}</section></div><section class="card"><h2>Últimos lançamentos</h2>${table(data.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,7))}</section>`:tab==='finance'?'<section class="card"><div id="formslot"></div><h2>Histórico de lançamentos</h2>'+table(data.slice().sort((a,b)=>b.date.localeCompare(a.date)))+'</section>':tab==='investments'?investments():workouts()}
${message?'<div class="notice">'+esc(message)+'</div>':''}<div class="footer">Meu Painel Pessoal · offline-first · dados neste navegador</div>`;
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.getElementById('period').onchange=e=>{filterMonth=e.target.value;render()};document.getElementById('new').onclick=()=>{tab='finance';showForm=true;render()};if(tab==='finance'&&showForm)form()}
function chart(){const ms=[];const d=new Date(filterMonth+'-02T12:00:00');for(let i=5;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);const key=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');let m={key,label:x.toLocaleDateString('pt-BR',{month:'short'}),income:0,expense:0};data.filter(t=>(t.competence||t.date||'').slice(0,7)===key&&t.dre!==false).forEach(t=>{if(t.type==='income')m.income+=t.amount;if(t.type==='expense')m.expense+=t.amount});ms.push(m)}const max=Math.max(1,...ms.flatMap(m=>[m.income,m.expense]));return '<div class="barset">'+ms.map(m=>'<div class="monthbar"><div class="bars"><div class="bar" title="Receitas '+money(m.income)+'" style="height:'+Math.max(2,m.income/max*100)+'%;background:#42d6a0"></div><div class="bar" title="Despesas '+money(m.expense)+'" style="height:'+Math.max(2,m.expense/max*100)+'%;background:#ff818d"></div></div><small>'+m.label+'</small></div>').join('')+'</div><p class="small muted"><span style="color:#42d6a0">■</span> Receitas &nbsp; <span style="color:#ff818d">■</span> Despesas</p>'}
function cats(rows){const o={};rows.filter(t=>t.type==='expense'&&t.dre!==false).forEach(t=>o[t.cat||'Sem categoria']=(o[t.cat||'Sem categoria']||0)+t.amount);const arr=Object.entries(o).sort((a,b)=>b[1]-a[1]);if(!arr.length)return '<div class="empty">Sem despesas neste período.</div>';const max=arr[0][1];return arr.map(([n,v])=>'<div class="categoryrow"><div class="row"><span>'+esc(n)+'</span><b>'+money(v)+'</b></div><div class="track"><div class="fill" style="width:'+Math.max(3,v/max*100)+'%"></div></div></div>').join('')}
function table(rows){if(!rows.length)return '<div class="empty">Nenhum lançamento.</div>';return '<div class="tablewrap"><table><thead><tr><th>Descrição</th><th>Categoria</th><th>Data</th><th>Pagamento</th><th class="right">Valor</th></tr></thead><tbody>'+rows.map(t=>'<tr><td>'+esc(t.desc)+(t.note?'<small>'+esc(t.note)+'</small>':'')+'</td><td>'+esc(t.cat)+'</td><td>'+new Date(t.date+'T12:00:00').toLocaleDateString('pt-BR')+'</td><td>'+esc(t.pay||'—')+'</td><td class="right '+(t.type==='income'?'income':t.type==='expense'?'expense':'')+'">'+(t.type==='income'?'+ ':t.type==='expense'?'- ':'')+money(t.amount)+'</td></tr>').join('')+'</tbody></table></div>'}
function form(){document.getElementById('formslot').innerHTML='<form id="txform" class="card"><div class="formgrid"><label class="field">Descrição<input id="desc" required placeholder="Ex.: mercado"></label><label class="field">Valor em R$<input id="amount" required inputmode="decimal" placeholder="38,40"></label><label class="field">Tipo<select id="type"><option value="expense">Despesa</option><option value="income">Receita</option><option value="investment">Investimento</option><option value="movement">Movimentação (não despesa)</option></select></label><label class="field">Categoria<input id="cat" required placeholder="Alimentação, Mercado..."></label><label class="field">Data<input id="date" type="date" required value="'+now()+'"></label><label class="field">Pagamento<select id="pay"><option>Cartão de crédito</option><option>Pix</option><option>Débito</option><option>Dinheiro</option><option>Flash</option><option>Não informado</option></select></label><label class="field">Competência DRE<input id="competence" type="date" value="'+now()+'"></label><label class="field">Classificação<select id="recurrence"><option value="variable">Variável</option><option value="fixed">Fixa</option><option value="extraordinary">Extraordinária</option><option value="recurring">Recorrente</option></select></label></div><br><div class="row"><button type="button" class="btn secondary" id="cancel">Cancelar</button><button class="btn">Salvar</button></div></form>';document.getElementById('cancel').onclick=()=>{showForm=false;render()};document.getElementById('txform').onsubmit=e=>{e.preventDefault();const amount=Number(document.getElementById('amount').value.replace(',','.'));if(!Number.isFinite(amount)||amount<=0){alert('Confere o valor.');return}const type=document.getElementById('type').value;data.push({id:'local-'+Date.now(),date:document.getElementById('date').value,competence:document.getElementById('competence').value,desc:document.getElementById('desc').value.trim(),amount,type,cat:document.getElementById('cat').value.trim(),pay:document.getElementById('pay').value,dre:['income','expense'].includes(type),recurrence:document.getElementById('recurrence').value});save();showForm=false;message='Lançamento salvo neste dispositivo.';render()}}
function investments(){return '<section class="card"><h2>Carteira de investimentos</h2><p class="muted">Últimos saldos conhecidos, informados em conversa. Confere a data antes de usar como posição atual.</p>'+[['Fundo Ibovespa — Sicredi',2859.14],['Sicredi CDI CICFIRT RL',6986],['Sicredi Taxa Selic CIC FIRF RL (bruto)',28000.01],['Sicredi Crédito Privado Bancário (resgate)',14489.94],['CDB Banco XP — reserva planejada',4000]].map(x=>'<div class="row" style="padding:12px 0;border-bottom:1px solid #22354e"><span>'+esc(x[0])+'</span><b>'+money(x[1])+'</b></div>').join('')+'<div class="notice">Valores históricos/planejados, não confirmação de saldo atual nem de aplicação realizada.</div></section>'}
function workouts(){return '<section class="card"><h2>Último treino registrado</h2><p class="muted">Costas e bíceps · 03/10/2026</p>'+[['Puxada alta',45],['Remada baixa',45],['Pullover',25],['Rosca Scott',30],['Rosca martelo',8]].map(x=>'<div class="row" style="padding:10px 0;border-bottom:1px solid #22354e"><span>'+x[0]+'</span><b>'+x[1]+' kg</b></div>').join('')+'</section>'}
save();render();if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
